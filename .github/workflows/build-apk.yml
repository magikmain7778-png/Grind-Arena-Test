name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget zip

      - name: Extrair projeto
        run: |
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -o fps-grind.zip -d "$GITHUB_WORKSPACE/project"
          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/project" -name project.godot -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERRO: project.godot não encontrado."
            exit 1
          fi
          echo "GODOT_PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Baixar Godot 4.2.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip -O godot.zip
          unzip -o godot.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Baixar templates do Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          unzip -o templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/4.2.2.stable/"

      - name: Configurar Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          mkdir -p cmdline
          unzip -q cmdline.zip -d cmdline
          mv cmdline/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Verificar preset Android existente
        run: |
          if [ ! -f "$GODOT_PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERRO: o projeto não contém export_presets.cfg."
            echo "É necessário criar uma predefinição Android válida no Godot."
            exit 1
          fi
          grep -q 'platform="Android"' "$GODOT_PROJECT_DIR/export_presets.cfg" || {
            echo "ERRO: não foi encontrada uma predefinição Android válida."
            exit 1
          }

      - name: Configurar caminhos Android no Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$HOME/android-sdk"
          EOF

      - name: Validar projeto
        run: |
          ./godot --headless --path "$GODOT_PROJECT_DIR" --editor --quit

      - name: Exportar APK
        run: |
          set -o pipefail
          ./godot --headless --verbose --path "$GODOT_PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/Jogo.apk" 2>&1 | tee "$GITHUB_WORKSPACE/export.log"

      - name: Enviar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Exportacao
          path: export.log
          if-no-files-found: ignore

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Jogo-APK
          path: Jogo.apk
          if-no-files-found: error
          
